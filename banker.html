<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">

<title>吹牛王 · 莊家後台</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">

<body>
<div class="wrap">
  <header class="board-header banker">
    <div class="title-block">

      <h1>莊家<span class="accent-b">後台</span></h1>
    </div>
    <a class="head-link" href="index.html" target="_blank">開啟玩家下注頁 ↗</a>

  <div id="storageStatus" class="banner warn" style="display:none;">

  </div>

  <nav class="tabs" id="tabs"></nav>
  <main id="main"></main>

    這個頁面沒有密碼保護 —— 資料庫是刻意開放的，拆頁只是避免玩家誤觸管理功能。<br>
    請不要把這個網址跟玩家的網址一起發出去。
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDMq0XabHZFuOK_Olja-cqSOMDx2ygc8i4",
  authDomain: "dicebetpanel.firebaseapp.com",
  databaseURL: "https://dicebetpanel-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "dicebetpanel",
};
const TAB_KEY = 'dbp-banker-tab';

let db = null, firebaseReady = false;
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  firebaseReady = true;
}catch(e){ firebaseReady = false; }

let state = null, pools = {};
let activeTab = 'markets';
let timeBucket = 10;
let newCategory = 'binary';
let binarySource = 'roster';

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}
function setStorageWarning(broken){
  document.getElementById('storageStatus').style.display = broken ? 'block' : 'none';
  document.getElementById('storageOk').style.display     = broken ? 'none' : 'block';
}

function boot(){
  activeTab = localStorage.getItem(TAB_KEY) || 'markets';
  if(!firebaseReady){
    setStorageWarning(true);
    state = normalize(seed()); pools = buildPools(state); render();
    return;
  }
  db.ref('.info/connected').on('value', s=>{
    const on = s.val() === true;
    document.getElementById('connDot').classList.toggle('on', on);
    document.getElementById('connText').textContent = on ? '已連線。' : '連線中斷，正在重連……';
  });
  db.ref(DB_PATH).transaction(cur => (cur === null ? seed() : undefined)).catch(()=>{});
  db.ref(DB_PATH).on('value', s=>{
    state = normalize(s.val()); pools = buildPools(state);
    setStorageWarning(false); render();
  }, err=>{
    setStorageWarning(true);
    showToast('讀取失敗：' + String(err).slice(0,60));
  });
}

/* ---------- 重繪時保留輸入焦點 ---------- */
const FOCUS_KEYS = ['oddsIn','priorK','pidx','maxBet','newTitle','newBanker','newPriorK','newOptions',
                    'binA','binB','matchA','matchB','matchBanker','matchPriorK',
                    'marketMax','marketPer','marketLiab'];
function captureFocus(){
  const el = document.activeElement;
  if(!el || !el.dataset) return null;
  for(const k of FOCUS_KEYS){
    if(el.dataset[k] !== undefined){
      const attr = 'data-' + k.replace(/[A-Z]/g, c=>'-'+c.toLowerCase());
      return { sel:`[${attr}="${el.dataset[k]}"]`, s:el.selectionStart, e:el.selectionEnd, val:el.value };
    }
  }
  return null;
}
function restoreFocus(f){
  if(!f) return;
  const el = document.querySelector(f.sel);
  if(!el) return;
  if(el.value !== f.val && f.val !== undefined) el.value = f.val;
  el.focus();
  try{ el.setSelectionRange(f.s, f.e); }catch(err){}
}

function render(){
  const f = captureFocus();
  renderSummary();
  renderTabs();
  const main = document.getElementById('main');
  if(activeTab === 'markets')      main.innerHTML = renderMarketsTab();
  else if(activeTab === 'reports') main.innerHTML = renderReportsTab();
  else                             main.innerHTML = renderSettingsTab();
  attachHandlers();
  restoreFocus(f);
}

function renderSummary(){
  const exp = bankerExposure(state, pools);
  const bettors = new Set(state.bets.map(b=>b.bettorId || b.name)).size;
  const open = state.markets.filter(m=>!m.settled).length;
  const netCls = exp.settledNet >= 0 ? 'pos' : 'neg';
  const worstCls = exp.worstTotal >= 0 ? 'pos' : 'neg';
  document.getElementById('summaryStrip').innerHTML = `
    <div class="stat-card blue"><div class="num">$${fmt(exp.staked)}</div><div class="lbl">全場總注金</div></div>
    <div class="stat-card blue"><div class="num">${state.bets.length}</div><div class="lbl">注單數</div></div>
    <div class="stat-card blue"><div class="num">${bettors}</div><div class="lbl">參與人數</div></div>
    <div class="stat-card"><div class="num ${netCls}">${exp.settledNet>=0?'+':''}${fmt(exp.settledNet)}</div><div class="lbl">已結算莊家淨收益</div></div>
    <div class="stat-card"><div class="num ${worstCls}">${exp.worstTotal>=0?'+':''}${fmt(exp.worstTotal)}</div><div class="lbl">最壞情況（含未結算 ${open} 盤）</div></div>
  `;
}

function renderTabs(){
  const groups = [
    { key:'markets', label:`盤口管理 (${state.markets.length})` },
    { key:'reports', label:'資料報表' },
    { key:'settings', label:'設定與備份' },
  ];
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = groups.map(g=>
    `<button class="tab-btn blue ${activeTab===g.key?'active blue':''}" data-tab="${g.key}">${esc(g.label)}</button>`
  ).join('');
  tabs.querySelectorAll('.tab-btn').forEach(b=>{
    b.onclick = ()=>{
      activeTab = b.dataset.tab;
      try{ localStorage.setItem(TAB_KEY, activeTab); }catch(e){}
      render();
    };
  });
}

/* ============================================================
   盤口管理
   ============================================================ */
function renderMarketsTab(){
  return renderMatchPanel() + renderCreatePanel() + renderBatchPanel() +
    (state.markets.length === 0
      ? `<div class="empty-note">還沒有任何盤口。用上面的表單開第一個。</div>`
      : state.markets.map(renderMarketCard).join(''));
}

// 把「定價黏性」翻譯成看得懂的體感：一筆滿額注會把賠率推動多少。
// 選項數會大幅影響結果，所以一定要帶入實際的選項數。
function impactHint(priorK, optionCount){
  const n = optionCount || 2;
  const im = maxBetImpact(priorK, state.maxBet, n);
  if(!im) return '定價黏性＝相當於莊家先押多少錢在自己開的價上。';
  const warn = im.dropPct >= 25;
  const suggest = warn ? suggestPriorK(state.maxBet, n, 0.2) : null;
  return `定價黏性＝相當於莊家先押多少錢在自己開的價上。<br>`
    + `以 <b>${n} 個等價選項</b>、上限 $${fmt(state.maxBet)} 計算，`
    + `一筆滿額注會把 <b>${im.before.toFixed(2)} 推到 ${im.after.toFixed(2)}</b>（移動 ${im.dropPct}%）`
    + (warn ? `　⚠ 波動偏大，想壓到 20% 以內建議黏性設 <b>${fmt(suggest)}</b> 以上` : '');
}

// 開盤表單目前會產生幾個選項
function pendingOptionCount(){
  if(newCategory === 'multi')  return PLAYER_COUNT;
  if(newCategory === 'binary') return 2;
  const el = document.getElementById('newOptions');
  const n = el ? el.value.split(/[,，]/).map(s=>s.trim()).filter(Boolean).length : 0;
  return n >= 2 ? n : 2;
}

function renderMatchPanel(){
  const no = nextMatchNo(state);
  const used = [...new Set(state.markets.filter(m=>m.matchNo).map(m=>m.matchNo))];
  const bigOpts = [];
  for(let i=2;i<=MAX_HP;i++){
    bigOpts.push(`<option value="${i}" ${i===DEFAULT_BIG_MIN?'selected':''}>${i} 格以上為大</option>`);
  }
  const sel = (id, defIdx) => `<select data-${id}="1" id="${id}">${
    state.players.map((p,i)=>`<option value="${i}"${i===defIdx?' selected':''}>${esc(p)}</option>`).join('')}</select>`;

  const bigMin = DEFAULT_BIG_MIN;
  const bs = bigSmallProbs(bigMin), oe = oddEvenProbs();
  const O = MATCH_OVERROUND;

  return `<div class="panel">
    <h2>開一場單挑賽事（一次建三個盤）</h2>
    <div class="panel-grid">
      <div class="form-col">
        <h3>賽事編號</h3>
        <div class="auto-no">第 <b id="matchNoShow">${no}</b> 場<span>自動編號</span></div>
        ${used.length ? `<p class="form-hint">已開過：${used.map(esc).join('、')}</p>` : ''}
        <h3 style="margin-top:14px;">參賽玩家</h3>
        ${sel('matchA', 0)}
        ${sel('matchB', 1)}
        <p class="form-hint">從名單挑，不用打字。之後在「設定」改名單，所有場次的盤口會跟著同步。</p>
      </div>
      <div class="form-col">
        <h3>莊家與定價</h3>
        <input data-match-banker="1" id="matchBanker" placeholder="莊家名字（必填）" maxlength="20" value="莊家">
        <input data-match-prior-k="1" id="matchPriorK" type="number" min="100" step="1000"
               value="${DEFAULT_PRIOR_K}" placeholder="定價黏性">
        <select id="matchBigMin">${bigOpts.join('')}</select>
        <p class="form-hint" id="matchImpact">${impactHint(DEFAULT_PRIOR_K, 2)}</p>
      </div>
      <div class="form-col">
        <h3>會建立這三個盤（賠率已依機率算好）</h3>
        <div class="odds-preview" id="matchOddsPreview">${matchOddsPreview(bigMin)}</div>
        <p class="form-hint">
          比分指<b>獲勝者剩餘血格</b>。血量五格、歸零淘汰，所以「險勝」比「完勝」
          常見得多 —— 剩 1 格的機率是剩 5 格的 4.4 倍，大小與單雙<b>本來就不是五五波</b>。
          以上賠率假設雙方實力相當，開完可再依實力微調。
        </p>
        <button type="button" id="matchBtn">建立這場的三個盤</button>
      </div>
    </div>
  </div>`;
}

// 開盤前先把三個盤的賠率算給莊家看
function matchOddsPreview(bigMin){
  const bs = bigSmallProbs(bigMin), oe = oddEvenProbs(), O = MATCH_OVERROUND;
  const row = (label, p, odds) =>
    `<tr><td>${esc(label)}</td><td class="num">${(p*100).toFixed(1)}%</td><td class="num">${odds.toFixed(2)}x</td></tr>`;
  return `<table class="ledger">
    <thead><tr><th>選項</th><th class="num">機率</th><th class="num">賠率</th></tr></thead>
    <tbody>
      ${row('誰獲勝（各方）', 0.5, oddsFromProb(0.5, O))}
      ${row('大', bs.big,   oddsFromProb(bs.big,   O))}
      ${row('小', bs.small, oddsFromProb(bs.small, O))}
      ${row('單', oe.odd,   oddsFromProb(oe.odd,   O))}
      ${row('雙', oe.even,  oddsFromProb(oe.even,  O))}
    </tbody></table>
    <p class="form-hint" style="margin-top:6px;">莊家水錢 +${((O-1)*100).toFixed(0)}%</p>`;
}

function renderCreatePanel(){
  const playerOpts = state.players.map((p,i)=>`<option value="p${i}">${esc(p)}</option>`).join('');
  return `<div class="panel">
    <h2>開新盤口</h2>
    <div class="panel-grid">
      <div class="form-col">
        <h3>1. 選分類</h3>
        <div class="radio-row">
          ${CATEGORIES.map(c=>`<label><input type="radio" name="cat" value="${c.key}" ${newCategory===c.key?'checked':''}> ${esc(c.label)}</label>`).join('')}
        </div>
        <p class="form-hint">${esc((CATEGORIES.find(c=>c.key===newCategory)||{}).hint || '')}</p>
      </div>
      <div class="form-col">
        <h3>2. 基本資料</h3>
        <input data-new-title="1" id="newTitle" placeholder="盤口名稱，例如：八強 A 桌誰晉級" maxlength="80">
        <input data-new-banker="1" id="newBanker" placeholder="莊家名字（必填）" maxlength="20">
        <input data-new-prior-k="1" id="newPriorK" type="number" min="100" step="1000"
               value="${DEFAULT_PRIOR_K}" placeholder="定價黏性">
        <p class="form-hint" id="createImpact">${impactHint(DEFAULT_PRIOR_K, pendingOptionCount())}</p>
      </div>
      <div class="form-col">
        <h3>3. 選項</h3>
        ${newCategory === 'multi' ? `
          <p class="form-hint">自動使用 <b>16 人名單</b>，標籤會跟著名單同步。</p>
        ` : newCategory === 'binary' ? `
          <div class="radio-row">
            <label><input type="radio" name="binsrc" value="roster" ${binarySource==='roster'?'checked':''}> 從名單挑兩位</label>
            <label><input type="radio" name="binsrc" value="custom" ${binarySource==='custom'?'checked':''}> 自由輸入</label>
          </div>
          ${binarySource === 'roster' ? `
            <select data-bin-a="1" id="binA">${playerOpts}</select>
            <select data-bin-b="1" id="binB">${playerOpts}</select>
            <p class="form-hint">名字會跟著玩家名單同步，適合單挑桌。</p>
          ` : `
            <input data-bin-a="1" id="binA" placeholder="選項一，例如：大" maxlength="30">
            <input data-bin-b="1" id="binB" placeholder="選項二，例如：小" maxlength="30">
            <p class="form-hint">適合單雙、大小這類非選手的盤。</p>
          `}
        ` : `
          <input data-new-options="1" id="newOptions" placeholder="選項用逗號分隔，例如：有,沒有,不確定" maxlength="200">
          <p class="form-hint">至少兩個選項。</p>
        `}
        <button type="button" id="createBtn">開盤</button>
      </div>
    </div>
  </div>`;
}

function renderBatchPanel(){
  const targets = state.markets.filter(m=>!m.settled && usesPlayerRoster(m));
  if(targets.length === 0) return '';
  return `<div class="panel">
    <h2>一次結算所有多選項盤</h2>
    <div class="form-col" style="max-width:420px;">
      <select id="seriesWinner">
        <option value="">選擇冠軍／結果...</option>
        ${state.players.map((p,i)=>`<option value="p${i}">${esc(p)}</option>`).join('')}
      </select>
      <p class="form-hint">會一次結算這 ${targets.length} 個盤口：<br>
        ${targets.map(m=>`· ${esc(m.title)}（$${fmt(marketTotal(pools,m))}）`).join('<br>')}</p>
      <button type="button" id="seriesBtn">全部結算</button>
    </div>
  </div>`;
}

function renderMarketCard(market){
  const total = marketTotal(pools, market);
  const maxPool = Math.max(1, ...market.options.map(o=>poolOf(pools, market.id, o.id)));
  const info = market.settled ? settleInfo(state, pools, market) : null;

  const rows = market.options.map((opt, idx)=>{
    const pool = poolOf(pools, market.id, opt.id);
    const isWinner = market.settled && opt.id === market.winnerId;
    const lo = liveOdds(pools, market, opt.id);
    const moved = lo.auto && Math.abs(lo.value - lo.opening) >= 0.01;
    const key = `${market.id}:${opt.id}`;
    return `
      <div class="option-row ${isWinner?'is-winner':''}">
        <div class="pip">${DICE_PIPS[idx % 6]}</div>
        <div class="opt-main">
          <div class="opt-label-line">
            <span class="lbl">${esc(optionLabel(state, market, opt))}${isWinner?' 🏆':''}</span>
            <span class="odds-wrap">
              <span class="odds">${lo.value.toFixed(2)}x</span>
              ${moved?`<span class="odds-open">開 ${lo.opening.toFixed(2)}</span>`:''}
            </span>
          </div>
          <div class="bar-track"><div class="bar-fill blue" style="width:${total>0?(pool/maxPool*100):0}%"></div></div>
          <div class="pool-amt">注金：$${fmt(pool)}</div>
          ${!market.settled ? `
          <div class="odds-edit">
            <label>${market.autoPrice ? '初始定價' : '掛牌賠率'}</label>
            <input type="number" min="1.01" step="0.05" inputmode="decimal"
                   data-odds-in="${key}" value="${opt.odds.toFixed(2)}">
            <span class="odds-note">${market.autoPrice ? '掛牌價由此價與注額推導' : '改了只影響之後的新注單'}</span>
          </div>` : ''}
        </div>
      </div>`;
  }).join('');

  let banner = '';
  if(market.settled){
    const winOpt = market.options.find(o=>o.id === market.winnerId);
    const net = info.bankerNet;
    banner = `<div class="winner-banner">🏆 結果：${esc(optionLabel(state, market, winOpt))}
      <br>收到注金 $${fmt(info.total)}　派彩 $${fmt(info.payoutTotal)}
      <br>莊家淨${net>=0?'收益':'虧損'}：<span class="${net>=0?'profit-pos':'profit-neg'}">${net>=0?'+':''}${fmt(net)}</span>
      ${info.empty?'<br>（這盤沒有人下注）':''}</div>`;
  }else if(market.locked){
    banner = `<div class="lock-note">🔒 已封盤，玩家無法下注。</div>`;
  }

  const margin = bookMargin(market) * 100;
  const controls = market.settled ? '' : `
    <div class="book-controls">
      <label><input type="checkbox" data-auto-toggle="${market.id}" ${market.autoPrice?'checked':''}> 自動依下注額調價</label>
      ${market.autoPrice ? `<label>定價黏性
        <input type="number" min="100" step="1000" inputmode="numeric" data-prior-k="${market.id}" value="${market.priorK}"></label>
        ${(()=>{ const im = maxBetImpact(market.priorK, state.maxBet, market.options.length);
                 if(!im) return '';
                 const w = im.dropPct >= 25;
                 return `<span class="odds-note"${w?' style="color:var(--red-bright)"':''}>滿額注移動 ${im.dropPct}%${
                   w ? `（建議黏性 ${fmt(suggestPriorK(state.maxBet, market.options.length, 0.2))} 以上）` : ''}</span>`; })()}` : ''}
      <span class="bc-margin ${margin>=0?'':'neg'}">初始定價利潤率 ${margin>=0?'+':''}${margin.toFixed(1)}%${margin<0?'　⚠ 負值，長期不利':''}</span>
    </div>
    <div class="book-controls">
      <label>本盤單筆上限
        <input type="number" min="0" step="500" inputmode="numeric" placeholder="沿用全域"
               data-market-max="${market.id}" value="${market.maxBet || ''}"></label>
      <label>每人上限
        <input type="number" min="0" step="500" inputmode="numeric" placeholder="不限制"
               data-market-per="${market.id}" value="${market.maxPerBettor || ''}"></label>
      <label>單選項曝險上限
        <input type="number" min="0" step="5000" inputmode="numeric" placeholder="不限制"
               data-market-liab="${market.id}" value="${market.maxLiability || ''}"></label>
      <span class="odds-note">留空＝沿用全域／不限制。曝險上限只擋爆掉的那個選項；每人上限比對裝置與暱稱，是軟性限制。</span>
    </div>`;

  const actions = `
    <div class="settle-bar">
      ${market.settled ? `<button class="undo-btn" data-undo-btn="${market.id}">撤銷結算</button>` : `
        <button class="lock-btn" data-lock-btn="${market.id}">${market.locked?'重新開盤':'封盤'}</button>
        <select data-settle-select="${market.id}">
          <option value="">選擇正確結果...</option>
          ${market.options.map(o=>`<option value="${o.id}">${esc(optionLabel(state,market,o))}</option>`).join('')}
        </select>
        <button data-settle-btn="${market.id}">結算並派彩</button>
      `}
      <button class="del-btn" data-del-btn="${market.id}">刪除盤口</button>
    </div>`;

  return `
    <div class="market-card ${market.settled?'settled':''} ${(!market.settled&&market.locked)?'locked':''}">
      <div class="market-head">
        <h2>${esc(market.title)}${market.matchNo?`<span class="chip match">第 ${esc(market.matchNo)} 場</span>`:''}<span class="chip cat">${esc(categoryLabel(market.category))}</span>${
          market.settled?'<span class="chip done">已結算</span>':(market.locked?'<span class="chip lock">封盤</span>':'')}</h2>
        <div class="market-pool-badge">總注金 $${fmt(total)}</div>
      </div>
      <div class="banker-line">莊家：<b>${esc(market.banker)}</b></div>
      ${banner}
      ${controls}
      ${rows}
      ${!market.settled ? renderBankerRisk(market) : renderLedger(market)}
      ${actions}
    </div>`;
}

function renderBankerRisk(market){
  const staked = marketTotal(pools, market);
  if(staked <= 0){
    return `<div class="banker-risk"><div class="br-title">莊家風險</div>
      <div class="br-empty">還沒有人下注，目前沒有曝險。</div></div>`;
  }
  const funded = market.options.filter(o => poolOf(pools, market.id, o.id) > 0);
  const rows = funded.map(o=>{
    const net = bankerNetIfWins(state, pools, market, o.id);
    return `<tr><td>${esc(optionLabel(state, market, o))} 開出</td>
      <td class="num ${net>=0?'profit-pos':'profit-neg'}">${net>=0?'+':''}${fmt(net)}</td></tr>`;
  }).join('');
  const hasUnbacked = market.options.some(o => poolOf(pools, market.id, o.id) <= 0);
  const worst = worstCase(state, pools, market);
  const usage = liabilityUsage(state, pools, market);
  const gauge = usage ? `
    <div class="liab-gauge">
      <div class="liab-label">曝險使用率 ${usage.pct}%　$${fmt(usage.used)} / $${fmt(usage.cap)}</div>
      <div class="bar-track"><div class="bar-fill ${usage.pct>=80?'':'blue'}" style="width:${usage.pct}%"></div></div>
      ${usage.pct >= 100 ? '<div class="liab-full">已達上限，新的注會被擋下</div>' : ''}
    </div>` : '';
  return `<div class="banker-risk">
    <div class="br-title">莊家 ${esc(market.banker)} 的風險　·　已收注金 $${fmt(staked)}</div>
    ${gauge}
    <div class="table-scroll"><table class="ledger"><tbody>
      ${rows}
      ${hasUnbacked ? `<tr><td>其他沒人押的選項開出</td><td class="num profit-pos">+${fmt(staked)}</td></tr>` : ''}
      <tr class="br-worst"><td><b>最壞情況</b></td>
        <td class="num ${worst>=0?'profit-pos':'profit-neg'}"><b>${worst>=0?'+':''}${fmt(worst)}</b></td></tr>
    </tbody></table></div>
  </div>`;
}

function renderLedger(market){
  const all = state.bets.filter(b => b.marketId === market.id);
  if(all.length === 0) return `<div class="empty-note">這盤沒有人下注。</div>`;
  const rows = all.map(b=>{
    const o = betOutcome(state, pools, b);
    const opt = market.options.find(x=>x.id === b.optionId);
    return `<tr>
      <td>${esc(b.name)}</td>
      <td>${esc(optionLabel(state, market, opt))}</td>
      <td class="num">${betOdds(b).toFixed(2)}x</td>
      <td class="num">$${fmt(b.amount)}</td>
      <td class="num">${o.status==='win' ? '$'+fmt(o.payout) : '—'}</td>
      <td class="num ${o.profit>=0?'profit-neg':'profit-pos'}">${(-o.profit)>=0?'+':''}${fmt(-o.profit)}</td>
    </tr>`;
  }).join('');
  return `<div class="table-scroll"><table class="ledger">
    <thead><tr><th>下注者</th><th>押</th><th class="num">鎖定賠率</th><th class="num">下注</th><th class="num">派彩</th><th class="num">莊家淨</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

function renderTimeReport(){
  const rows = reportByTime(state, timeBucket);
  const maxStake = Math.max(1, ...rows.map(r=>r.staked));
  const fmtTime = (t)=>{
    const d = new Date(t);
    const p = n=>String(n).padStart(2,'0');
    return `${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  };
  return `<div class="panel"><h2>by 時間</h2>
    <div class="seg-btns">
      <button data-bucket="10" class="${timeBucket===10?'active':''}">10 分鐘</button>
      <button data-bucket="60" class="${timeBucket===60?'active':''}">1 小時</button>
    </div>
    ${rows.length === 0 ? `<div class="empty-note">還沒有任何下注。</div>` : `
    <div class="table-scroll"><table class="ledger">
      <thead><tr><th>時段</th><th class="num">注單</th><th class="num">注金</th><th class="bar-cell">分布</th><th class="num">累計</th></tr></thead>
      <tbody>${rows.map(r=>`<tr>
        <td>${fmtTime(r.t)}</td>
        <td class="num">${r.bets}</td>
        <td class="num">$${fmt(r.staked)}</td>
        <td class="bar-cell"><div class="report-bar" style="width:${(r.staked/maxStake*100).toFixed(1)}%"></div></td>
        <td class="num">$${fmt(r.cumulative)}</td>
      </tr>`).join('')}</tbody>
    </table></div>`}
  </div>`;
}

function attachHandlers(){
  document.querySelectorAll('input[name=cat]').forEach(r=>{
    r.onchange = ()=>{ newCategory = r.value; render(); };
  });
  document.querySelectorAll('input[name=binsrc]').forEach(r=>{
    r.onchange = ()=>{ binarySource = r.value; render(); };
  });
  const createBtn = document.getElementById('createBtn');
  if(createBtn) createBtn.onclick = createMarket;
  const matchBtn = document.getElementById('matchBtn');
  if(matchBtn) matchBtn.onclick = createMatch;

  // 調整黏性（或選項數）時即時更新體感提示
  const mk = document.getElementById('matchPriorK'), mi = document.getElementById('matchImpact');
  if(mk && mi) mk.oninput = ()=>{ mi.innerHTML = impactHint(parseFloat(mk.value), 2); };
  const bm = document.getElementById('matchBigMin'), op = document.getElementById('matchOddsPreview');
  if(bm && op) bm.onchange = ()=>{ op.innerHTML = matchOddsPreview(parseInt(bm.value, 10)); };
  const nk = document.getElementById('newPriorK'), ni = document.getElementById('createImpact');
  const refreshCreateImpact = ()=>{
    if(ni) ni.innerHTML = impactHint(parseFloat(nk ? nk.value : DEFAULT_PRIOR_K), pendingOptionCount());
  };
  if(nk && ni) nk.oninput = refreshCreateImpact;
  const optIn = document.getElementById('newOptions');
  if(optIn) optIn.oninput = refreshCreateImpact;

  const seriesBtn = document.getElementById('seriesBtn');
  if(seriesBtn) seriesBtn.onclick = settleSeries;

  document.querySelectorAll('[data-bucket]').forEach(b=>{
    b.onclick = ()=>{ timeBucket = parseInt(b.dataset.bucket,10); render(); };
  });

  document.querySelectorAll('[data-odds-in]').forEach(inp=>{
    inp.onchange = async ()=>{
      const [mid, oid] = inp.dataset.oddsIn.split(':');
      const v = Math.round(parseFloat(inp.value) * 100) / 100;
      if(!(v > 1)){ showToast('賠率必須大於 1.00'); render(); return; }
      try{
        await db.ref(`${DB_PATH}/markets/${mid}/options/${oid}/odds`).set(v);
        showToast(`賠率已改為 ${v.toFixed(2)}x`);
      }catch(e){ showToast('更新失敗：' + String(e).slice(0,60)); }
    };
  });
  document.querySelectorAll('[data-auto-toggle]').forEach(cb=>{
    cb.onchange = async ()=>{
      try{
        await db.ref(`${DB_PATH}/markets/${cb.dataset.autoToggle}/autoPrice`).set(cb.checked);
        showToast(cb.checked ? '已開啟自動調價' : '已改為手動定價');
      }catch(e){ showToast('切換失敗：' + String(e).slice(0,60)); }
    };
  });
  document.querySelectorAll('[data-prior-k]').forEach(inp=>{
    inp.onchange = async ()=>{
      const v = Math.round(parseFloat(inp.value));
      if(!(v > 0)){ showToast('定價黏性必須是正數'); render(); return; }
      try{
        await db.ref(`${DB_PATH}/markets/${inp.dataset.priorK}/priorK`).set(v);
        showToast(`定價黏性已設為 ${fmt(v)}`);
      }catch(e){ showToast('更新失敗：' + String(e).slice(0,60)); }
    };
  });
  const numField = (attr, dataKey, dbField, label) => {
    document.querySelectorAll(`[data-${attr}]`).forEach(inp=>{
      inp.onchange = async ()=>{
        const v = inp.value.trim() === '' ? null : Math.round(parseFloat(inp.value));
        if(v !== null && !(v > 0)){ showToast(`${label}必須是正數，或留空`); render(); return; }
        try{
          await db.ref(`${DB_PATH}/markets/${inp.dataset[dataKey]}/${dbField}`).set(v);
          showToast(v === null ? `${label}已清除` : `${label}設為 $${fmt(v)}`);
        }catch(e){ showToast('更新失敗：' + String(e).slice(0,60)); }
      };
    });
  };
  numField('market-max',  'marketMax',  'maxBet',       '本盤單筆上限');
  numField('market-per',  'marketPer',  'maxPerBettor', '每人上限');
  numField('market-liab', 'marketLiab', 'maxLiability', '單選項曝險上限');

  document.querySelectorAll('[data-lock-btn]').forEach(b=> b.onclick = ()=> toggleLock(b.dataset.lockBtn));
  document.querySelectorAll('[data-settle-btn]').forEach(b=> b.onclick = ()=> settleMarket(b.dataset.settleBtn));
  document.querySelectorAll('[data-undo-btn]').forEach(b=> b.onclick = ()=> undoSettle(b.dataset.undoBtn));
  document.querySelectorAll('[data-del-btn]').forEach(b=> b.onclick = ()=> deleteMarket(b.dataset.delBtn));

  document.querySelectorAll('[data-pidx]').forEach(inp=>{
    inp.onchange = async ()=>{
      const i = parseInt(inp.dataset.pidx, 10);
      const v = inp.value.trim() || `選手${i+1}`;
      try{ await db.ref(`${DB_PATH}/players/${i}`).set(v); }
      catch(e){ showToast('改名失敗：' + String(e).slice(0,60)); }
    };
  });
  const maxBetInput = document.getElementById('maxBetInput');
  if(maxBetInput) maxBetInput.onchange = async ()=>{
    const v = Math.round(parseFloat(maxBetInput.value));
    if(!(v > 0)){ showToast('上限必須是正數'); render(); return; }
    try{
      await db.ref(`${DB_PATH}/maxBet`).set(v);
      showToast(`單筆上限已設為 $${fmt(v)}`);
    }catch(e){ showToast('更新失敗：' + String(e).slice(0,60)); }
  };

  const testConnBtn = document.getElementById('testConnBtn');
  if(testConnBtn) testConnBtn.onclick = testConnection;
  const exportBtn = document.getElementById('exportBtn');
  if(exportBtn) exportBtn.onclick = doExport;
  const importFile = document.getElementById('importFile');
  if(importFile) importFile.onchange = doImport;
  const resetBtn = document.getElementById('resetBtn');
  if(resetBtn) resetBtn.onclick = doReset;
}

async function createMatch(){
  const matchNo = String(nextMatchNo(state));
  const ai = parseInt(document.getElementById('matchA').value, 10);
  const bi = parseInt(document.getElementById('matchB').value, 10);
  const built = buildMatchMarkets({
    matchNo,
    playerAIndex: ai,
    playerBIndex: bi,
    banker:  document.getElementById('matchBanker').value,
    priorK:  Math.max(100, Math.round(parseFloat(document.getElementById('matchPriorK').value) || DEFAULT_PRIOR_K)),
    bigMin:  parseInt(document.getElementById('matchBigMin').value, 10),
  });
  if(built.error){ showToast(built.error); return; }

  if(!confirm(
    `建立第 ${matchNo} 場：${state.players[ai]} vs ${state.players[bi]}\n\n` +
    `會開三個盤：誰獲勝、結束比分大/小、結束比分單/雙\n` +
    `賠率依「雙方實力相當」計算，莊家水錢 +${((MATCH_OVERROUND-1)*100).toFixed(0)}%`
  )) return;

  try{
    const base = Date.now();
    for(let i=0;i<built.markets.length;i++){
      await db.ref(`${DB_PATH}/markets`).push({ ...built.markets[i], order: base + i });
    }
    showToast(`已建立第 ${matchNo} 場的三個盤口`);
    render();
  }catch(e){ showToast('建立失敗：' + String(e).slice(0,60)); }
}

async function createMarket(){
  const title = (document.getElementById('newTitle').value || '').trim();
  const banker = (document.getElementById('newBanker').value || '').trim();
  const priorK = Math.max(100, Math.round(parseFloat(document.getElementById('newPriorK').value) || DEFAULT_PRIOR_K));
  if(!title)  { showToast('請輸入盤口名稱'); return; }
  if(!banker) { showToast('請輸入莊家名字'); return; }

  const options = {};
  if(newCategory === 'multi'){
    for(let i=0;i<PLAYER_COUNT;i++) options['p'+i] = { order:i, odds:DEFAULT_ODDS };
  }else if(newCategory === 'binary'){
    const a = document.getElementById('binA').value;
    const b = document.getElementById('binB').value;
    if(binarySource === 'roster'){
      if(a === b){ showToast('兩位選手不能相同'); return; }
      options[a] = { order:0, odds:DEFAULT_ODDS };
      options[b] = { order:1, odds:DEFAULT_ODDS };
    }else{
      const la = (a||'').trim(), lb = (b||'').trim();
      if(!la || !lb){ showToast('請輸入兩個選項'); return; }
      options[uid()] = { label:la, order:0, odds:DEFAULT_ODDS };
      options[uid()] = { label:lb, order:1, odds:DEFAULT_ODDS };
    }
  }else{
    const labels = (document.getElementById('newOptions').value || '')
      .split(/[,，]/).map(s=>s.trim()).filter(Boolean);
    if(labels.length < 2){ showToast('至少需要兩個選項'); return; }
    labels.forEach((label,i)=>{ options[uid()] = { label, order:i, odds:DEFAULT_ODDS }; });
  }

  try{
    await db.ref(`${DB_PATH}/markets`).push({
      title, banker, category:newCategory,
      desc:'', autoPrice:true, priorK,
      order: Date.now(), locked:false, settled:false, winnerId:null,
      options
    });
    document.getElementById('newTitle').value = '';
    showToast('盤口已開');
    render();
  }catch(e){ showToast('開盤失敗：' + String(e).slice(0,60)); }
}

async function toggleLock(marketId){
  const m = state.markets.find(x=>x.id === marketId);
  if(!m) return;
  try{
    await db.ref(`${DB_PATH}/markets/${marketId}/locked`).set(!m.locked);
    showToast(m.locked ? '已重新開盤' : '已封盤');
  }catch(e){ showToast('操作失敗：' + String(e).slice(0,60)); }
}

async function settleMarket(marketId){
  const sel = document.querySelector(`[data-settle-select="${marketId}"]`);
  const winnerId = sel && sel.value;
  if(!winnerId){ showToast('請先選擇結果'); return; }
  const market = state.markets.find(m=>m.id === marketId);
  if(!market) return;
  const winOpt = market.options.find(o=>o.id === winnerId);
  const info = settleInfo(state, pools, { ...market, winnerId });
  if(!confirm(
    `確定以「${optionLabel(state, market, winOpt)}」結算「${market.title}」？\n\n` +
    `收到注金 $${fmt(info.total)}\n派彩 $${fmt(info.payoutTotal)}\n` +
    `莊家淨${info.bankerNet>=0?'收益':'虧損'}：${info.bankerNet>=0?'+':''}${fmt(info.bankerNet)}\n\n` +
    `結算後無法再下注，但可以「撤銷結算」。`
  )) return;
  try{
    await db.ref(`${DB_PATH}/markets/${marketId}`).update({ settled:true, winnerId, locked:true });
    showToast('已結算並派彩');
  }catch(e){ showToast('結算失敗：' + String(e).slice(0,60)); }
}

async function settleSeries(){
  const sel = document.getElementById('seriesWinner');
  const winnerId = sel && sel.value;
  if(!winnerId){ showToast('請先選擇結果'); return; }
  const targets = state.markets.filter(m=>!m.settled && usesPlayerRoster(m));
  if(targets.length === 0){ showToast('沒有可結算的盤口'); return; }
  const name = state.players[parseInt(winnerId.slice(1),10)];
  const lines = targets.map(m=>{
    const info = settleInfo(state, pools, { ...m, winnerId });
    return `· ${m.title}：派彩 $${fmt(info.payoutTotal)}，莊家淨 ${info.bankerNet>=0?'+':''}${fmt(info.bankerNet)}`;
  });
  if(!confirm(`確定以「${name}」一次結算下列 ${targets.length} 個多選項盤？\n\n${lines.join('\n')}\n\n每個盤都還可以個別撤銷。`)) return;
  const updates = {};
  targets.forEach(m=>{
    updates[`markets/${m.id}/settled`]  = true;
    updates[`markets/${m.id}/winnerId`] = winnerId;
    updates[`markets/${m.id}/locked`]   = true;
  });
  try{
    await db.ref(DB_PATH).update(updates);
    showToast(`已一次結算 ${targets.length} 個盤口`);
  }catch(e){ showToast('批次結算失敗：' + String(e).slice(0,60)); }
}

async function undoSettle(marketId){
  const market = state.markets.find(m=>m.id === marketId);
  if(!market || !market.settled) return;
  const info = settleInfo(state, pools, market);
  const winOpt = market.options.find(o=>o.id === market.winnerId);
  if(!confirm(
    `確定撤銷「${market.title}」的結算？\n\n` +
    `原本判定：${optionLabel(state, market, winOpt)}（莊家淨 ${info.bankerNet>=0?'+':''}${fmt(info.bankerNet)}）\n\n` +
    `撤銷後派彩作廢，${state.bets.filter(b=>b.marketId===marketId).length} 筆注單全部保留。\n` +
    `盤口會維持封盤，要重新收注請再按「重新開盤」。`
  )) return;
  try{
    await db.ref(`${DB_PATH}/markets/${marketId}`).update({ settled:false, winnerId:null, locked:true });
    showToast('已撤銷結算，盤口維持封盤');
  }catch(e){ showToast('撤銷失敗：' + String(e).slice(0,60)); }
}

async function deleteMarket(marketId){
  const market = state.markets.find(m=>m.id === marketId);
  if(!market) return;
  const related = state.bets.filter(b=>b.marketId === marketId);
  const total = marketTotal(pools, market);
  if(!confirm(
    `確定刪除盤口「${market.title}」？\n\n` +
    (related.length ? `這盤有 ${related.length} 筆注單、總注金 $${fmt(total)}，會一併永久刪除。\n` : `這盤還沒有人下注。\n`) +
    `無法復原。`
  )) return;
  if(related.length && !confirm(
    `再確認一次：${related.length} 筆注單（共 $${fmt(total)}）會被刪掉，無法復原。\n\n若只是想停止收注，按取消後改用「封盤」。`
  )) return;
  const updates = { [`markets/${marketId}`]: null };
  related.forEach(b=>{ updates[`bets/${b.id}`] = null; });
  try{
    await db.ref(DB_PATH).update(updates);
    showToast(related.length ? `盤口與 ${related.length} 筆注單已刪除` : '盤口已刪除');
  }catch(e){ showToast('刪除失敗：' + String(e).slice(0,60)); }
}

/* 實際寫一筆再讀回來刪掉。左上角的小綠點只代表連線握手成功，
   不保證寫得進去（例如資料庫規則被改成唯讀就會卡在這裡）。 */
async function testConnection(){
  const out = document.getElementById('testConnResult');
  const say = (msg, cls) => { if(out) out.innerHTML = `<b style="color:var(--${cls})">${msg}</b>`; };

  if(!firebaseReady){
    say('❌ Firebase 尚未初始化，請檢查 index.html 裡的 firebaseConfig', 'red-bright');
    showToast('Firebase 尚未初始化');
    return;
  }
  const ref = db.ref(`${DB_PATH}/__connTest__`);
  const token = 'ping-' + Date.now();
  const t0 = Date.now();
  try{
    say('測試中……', 'ivory-dim');
    await ref.set(token);
    const snap = await ref.once('value');
    const ms = Date.now() - t0;
    if(snap.exists() && snap.val() === token){
      await ref.remove().catch(()=>{});
      say(`✅ 讀寫正常，來回 ${ms} ms。玩家下注應該沒問題，請他重新整理再試一次。`, 'green');
      showToast(`✅ 讀寫正常（${ms} ms）`);
    }else{
      say('❌ 寫進去了但讀不回來 —— 檢查資料庫規則是否開放讀取', 'red-bright');
      showToast('❌ 寫入後讀不回來');
    }
  }catch(e){
    say(`❌ 失敗：${esc(String(e).slice(0,90))}<br>可能是網路斷線，或資料庫規則不允許寫入。`, 'red-bright');
    showToast('❌ 連線測試失敗');
  }
}

async function doExport(){
  let payload = null;
  try{ payload = (await db.ref(DB_PATH).once('value')).val(); }catch(e){}
  if(!payload){ showToast('沒有可匯出的資料'); return; }
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `吹牛王投注備份-${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.json`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('備份已下載');
}

function doImport(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (ev)=>{
    try{
      const parsed = JSON.parse(ev.target.result);
      if(!parsed || typeof parsed !== 'object') throw new Error('格式不對');
      if(confirm('確定要用這個備份檔覆蓋目前的所有資料嗎？')){
        await db.ref(DB_PATH).set(parsed);
        showToast('備份已還原');
      }
    }catch(err){ showToast('這個檔案看起來不是有效的備份檔'); }
    e.target.value = '';
  };
  reader.readAsText(file);
}

async function doReset(){
  if(!confirm('這會清空所有盤口與下注紀錄，確定重置整個賽事嗎？\n\n建議先按「匯出備份」。')) return;
  if(!confirm('再確認一次：所有人的注單都會消失，且無法復原。')) return;
  try{
    await db.ref(DB_PATH).set(seed());
    showToast('賽事已重置');
  }catch(e){ showToast('重置失敗：' + String(e).slice(0,60)); }
}

boot();
</script>
