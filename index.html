<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>骰俠吹牛王 · 投注站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="app.js"></script>
</head>
<body>
<div class="wrap">
  <header class="board-header">
    <div class="title-block">
      <div class="eyebrow">第一屆 · 骰俠吹牛王賽事</div>
      <h1>吹牛王<span class="accent">投注站</span></h1>
    </div>
  </header>

  <div id="storageStatus" class="banner warn" style="display:none;">
    ⚠️ 連不上資料庫，下注不會被記錄。請檢查網路後重新整理。
  </div>
  <div id="storageOk" class="banner ok" style="display:none;">
    <span class="conn-dot" id="connDot"></span><span id="connText">已連線，所有人看到的都是同一份即時資料。</span>
  </div>

  <section class="identity">
    <label for="meName">你的暱稱</label>
    <input id="meName" placeholder="輸入後就會記住" maxlength="20" autocomplete="off">
    <div class="me-stat" id="meStat"></div>
  </section>

  <section class="summary-strip" id="summaryStrip"></section>

  <nav class="tabs" id="tabs"></nav>

  <main id="marketList"></main>

  <footer>
    賠率由該盤莊家決定，並會隨大家的下注金額自動調整。<br>
    <b>你下注的當下就會鎖定當時的賠率</b>，之後價格再怎麼變都不影響你這一筆。<br>
    本頁不處理真實金流，金額僅作記帳籌碼。
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyDMq0XabHZFuOK_Olja-cqSOMDx2ygc8i4",
  authDomain: "dicebetpanel.firebaseapp.com",
  databaseURL: "https://dicebetpanel-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "dicebetpanel",
};

const NAME_KEY = 'dbp-name';
const ID_KEY   = 'dbp-bettor-id';
const TAB_KEY  = 'dbp-tab';

let db = null, firebaseReady = false;
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  firebaseReady = true;
}catch(e){ firebaseReady = false; }

let state = null, pools = {};
let activeTab = 'multi';
let me = { id:null, name:'' };
const draftAmounts = {};

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}
function setStorageWarning(broken){
  document.getElementById('storageStatus').style.display = broken ? 'block' : 'none';
  document.getElementById('storageOk').style.display     = broken ? 'none' : 'block';
}

/* ---------- 啟動 ---------- */
function boot(){
  me.id = localStorage.getItem(ID_KEY) || (function(){
    const v = uid(); try{ localStorage.setItem(ID_KEY, v); }catch(e){} return v;
  })();
  me.name = localStorage.getItem(NAME_KEY) || '';
  activeTab = localStorage.getItem(TAB_KEY) || 'multi';
  document.getElementById('meName').value = me.name;

  if(!firebaseReady){
    setStorageWarning(true);
    state = normalize(seed()); pools = buildPools(state); render();
    return;
  }
  db.ref('.info/connected').on('value', s=>{
    const on = s.val() === true;
    document.getElementById('connDot').classList.toggle('on', on);
    document.getElementById('connText').textContent = on
      ? '已連線，所有人看到的都是同一份即時資料。'
      : '連線中斷，正在重連……（這段期間的下注會在連線恢復後送出）';
  });
  db.ref(DB_PATH).on('value', s=>{
    state = normalize(s.val()); pools = buildPools(state);
    setStorageWarning(false); render();
  }, err=>{
    setStorageWarning(true);
    showToast('讀取失敗：' + String(err).slice(0,60));
  });
}

/* ---------- 重繪時保留輸入焦點 ---------- */
function captureFocus(){
  const el = document.activeElement;
  if(!el || !el.dataset || el.dataset.betAmt === undefined) return null;
  return { sel:`[data-bet-amt="${el.dataset.betAmt}"]`, s:el.selectionStart, e:el.selectionEnd };
}
function restoreFocus(f){
  if(!f) return;
  const el = document.querySelector(f.sel);
  if(!el) return;
  el.focus();
  try{ el.setSelectionRange(f.s, f.e); }catch(err){}
}

function render(){
  const f = captureFocus();
  renderIdentity();
  renderSummary();
  renderTabs();
  renderBody();
  restoreFocus(f);
}

function renderIdentity(){
  const mine = state.bets.filter(b => b.bettorId === me.id);
  const staked = mine.reduce((s,b)=> s + b.amount, 0);
  let settledProfit = 0, pending = 0;
  mine.forEach(b=>{
    const o = betOutcome(state, pools, b);
    if(o.status === 'pending') pending += b.amount; else settledProfit += o.profit;
  });
  const el = document.getElementById('meStat');
  if(mine.length === 0){
    el.innerHTML = me.name ? '還沒有下注紀錄' : '先輸入暱稱才能下注';
    return;
  }
  const cls = settledProfit >= 0 ? 'profit-pos' : 'profit-neg';
  el.innerHTML = `我的注單 <b>${mine.length}</b> 筆　已投入 <b>$${fmt(staked)}</b>`
    + `<br>已結算損益 <span class="${cls}">${settledProfit>=0?'+':''}${fmt(settledProfit)}</span>`
    + (pending > 0 ? `　未開 $${fmt(pending)}` : '');
}

function renderSummary(){
  const open = state.markets.filter(m=>!m.settled && !m.locked).length;
  const totalStaked = state.markets.reduce((s,m)=> s + marketTotal(pools, m), 0);
  const bettors = new Set(state.bets.map(b=>b.bettorId || b.name)).size;
  document.getElementById('summaryStrip').innerHTML = `
    <div class="stat-card"><div class="num">${open}</div><div class="lbl">開放下注中</div></div>
    <div class="stat-card"><div class="num">$${fmt(totalStaked)}</div><div class="lbl">全場總注金</div></div>
    <div class="stat-card"><div class="num">${state.bets.length}</div><div class="lbl">累計下注筆數</div></div>
    <div class="stat-card"><div class="num">${bettors}</div><div class="lbl">參與人數</div></div>
  `;
}

function renderTabs(){
  const mineCount = state.bets.filter(b=>b.bettorId === me.id).length;
  const groups = CATEGORIES.map(c=>({
    key:c.key,
    label:`${c.label}${state.markets.filter(m=>m.category===c.key && !m.settled).length
      ? ' ('+state.markets.filter(m=>m.category===c.key && !m.settled).length+')' : ''}`
  }));
  groups.push({ key:'mine', label:`我的下注${mineCount?' ('+mineCount+')':''}` });
  const tabs = document.getElementById('tabs');
  tabs.innerHTML = groups.map(g=>
    `<button class="tab-btn ${activeTab===g.key?'active':''}" data-tab="${g.key}">${esc(g.label)}</button>`
  ).join('');
  tabs.querySelectorAll('.tab-btn').forEach(b=>{
    b.onclick = ()=>{
      activeTab = b.dataset.tab;
      try{ localStorage.setItem(TAB_KEY, activeTab); }catch(e){}
      render();
    };
  });
}

function renderBody(){
  const list = document.getElementById('marketList');
  if(activeTab === 'mine'){ list.innerHTML = renderMyBets(); return; }
  const markets = state.markets.filter(m => m.category === activeTab);
  if(markets.length === 0){
    list.innerHTML = `<div class="empty-note">這個分類目前沒有盤口。<br>等莊家開盤後就會出現在這裡。</div>`;
    return;
  }
  list.innerHTML = markets.map(renderMarketCard).join('');
  attachHandlers();
}

function renderMarketCard(market){
  const total   = marketTotal(pools, market);
  const maxPool = Math.max(1, ...market.options.map(o=>poolOf(pools, market.id, o.id)));
  const info    = market.settled ? settleInfo(state, pools, market) : null;
  const canBet  = !market.settled && !market.locked;

  const rows = market.options.map((opt, idx)=>{
    const pool  = poolOf(pools, market.id, opt.id);
    const myAmt = state.bets
      .filter(b => b.bettorId === me.id && b.marketId === market.id && b.optionId === opt.id)
      .reduce((s,b)=> s + b.amount, 0);
    const isWinner = market.settled && opt.id === market.winnerId;
    const lo = liveOdds(pools, market, opt.id);
    const moved = lo.auto && Math.abs(lo.value - lo.opening) >= 0.01;
    const key = `${market.id}:${opt.id}`;

    return `
      <div class="option-row ${isWinner?'is-winner':''}">
        <div class="pip">${DICE_PIPS[idx % 6]}</div>
        <div class="opt-main">
          <div class="opt-label-line">
            <span class="lbl">${esc(optionLabel(state, market, opt))}${isWinner?' 🏆':''}</span>
            <span class="odds-wrap">
              <span class="odds" data-odds-for="${key}">${lo.value.toFixed(2)}x</span>
              ${moved?`<span class="odds-open">開 ${lo.opening.toFixed(2)}</span>`:''}
            </span>
          </div>
          <div class="bar-track"><div class="bar-fill blue" style="width:${total>0?(pool/maxPool*100):0}%"></div></div>
          <div class="pool-amt">注金：$${fmt(pool)}${myAmt>0?` · <span class="mine">我押 $${fmt(myAmt)}</span>`:''}</div>
          ${canBet ? `
          <div class="bet-form">
            <input class="amt-in" type="number" min="1" max="${state.maxBet}" step="1" inputmode="numeric"
                   placeholder="金額" data-bet-amt="${key}" value="${esc(draftAmounts[key] || '')}">
            ${QUICK_AMOUNTS.map(a=>`<button type="button" class="quick" data-quick="${key}" data-amt="${a}">+${a}</button>`).join('')}
            <button class="bet-go" data-bet-btn="${key}">下注</button>
          </div>` : ''}
        </div>
      </div>`;
  }).join('');

  let banner = '';
  if(market.settled){
    const winOpt = market.options.find(o=>o.id === market.winnerId);
    banner = `<div class="winner-banner">🏆 結果：${esc(optionLabel(state, market, winOpt))}
      ${info.empty ? '<br>這盤沒有人下注。' : `<br>總注金 $${fmt(info.total)}　派彩 $${fmt(info.payoutTotal)}`}</div>`;
  }else if(market.locked){
    banner = `<div class="lock-note">🔒 此盤已封盤，暫停下注。等莊家公布結果後結算。</div>`;
  }

  return `
    <div class="market-card ${market.settled?'settled':''} ${(!market.settled&&market.locked)?'locked':''}">
      <div class="market-head">
        <h2>${esc(market.title)}${market.matchNo?`<span class="chip match">第 ${esc(market.matchNo)} 場</span>`:''}<span class="chip cat">${esc(categoryLabel(market.category))}</span>${
          market.settled?'<span class="chip done">已結算</span>':(market.locked?'<span class="chip lock">封盤</span>':'')}</h2>
        <div class="market-pool-badge">總注金 $${fmt(total)}</div>
      </div>
      <div class="banker-line">莊家：<b>${esc(market.banker)}</b>　·　單筆上限 $${fmt(state.maxBet)}　·　下注當下即鎖定賠率</div>
      ${market.desc?`<div class="market-desc">${esc(market.desc)}</div>`:''}
      ${banner}
      ${rows}
      ${market.settled ? renderLedger(market) : ''}
    </div>`;
}

function renderLedger(market){
  const all = state.bets.filter(b => b.marketId === market.id);
  if(all.length === 0) return '';
  const rows = all.map(b=>{
    const o = betOutcome(state, pools, b);
    const opt = market.options.find(x=>x.id === b.optionId);
    return `<tr class="${b.bettorId===me.id?'is-me':''}">
      <td>${esc(b.name)}${b.bettorId===me.id?' <span style="color:var(--gold-bright)">(我)</span>':''}</td>
      <td>${esc(optionLabel(state, market, opt))}</td>
      <td class="num">${betOdds(b).toFixed(2)}x</td>
      <td class="num">$${fmt(b.amount)}</td>
      <td class="num ${o.profit>=0?'profit-pos':'profit-neg'}">${o.profit>=0?'+':''}${fmt(o.profit)}</td>
    </tr>`;
  }).join('');
  return `<div class="table-scroll"><table class="ledger">
    <thead><tr><th>下注者</th><th>押</th><th class="num">鎖定賠率</th><th class="num">下注</th><th class="num">淨利</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

function renderMyBets(){
  const mine = state.bets.filter(b => b.bettorId === me.id).slice().reverse();
  if(mine.length === 0){
    return `<div class="empty-note">你還沒有下注。<br>
      這一頁只看得到「這台裝置」下的注 —— 換手機或清掉瀏覽器資料就會看不到，但注單本身仍留在帳本裡。</div>`;
  }
  let staked = 0, pending = 0, settledProfit = 0;
  const rows = mine.map(b=>{
    const o = betOutcome(state, pools, b);
    const market = state.markets.find(m=>m.id === b.marketId);
    const opt = market && market.options.find(x=>x.id === b.optionId);
    staked += b.amount;
    if(o.status === 'pending') pending += b.amount; else settledProfit += o.profit;
    const cls = { win:'profit-pos', lose:'profit-neg' }[o.status] || '';
    return `<tr>
      <td>${esc(market ? market.title : '(已刪除)')}</td>
      <td>${esc(market && opt ? optionLabel(state, market, opt) : b.optionId)}</td>
      <td class="num">${betOdds(b).toFixed(2)}x</td>
      <td class="num">$${fmt(b.amount)}</td>
      <td class="${cls}">${o.label}</td>
      <td class="num ${o.profit>=0?'profit-pos':'profit-neg'}">${o.status==='pending'?'—':(o.profit>=0?'+':'')+fmt(o.profit)}</td>
    </tr>`;
  }).join('');
  const cls = settledProfit >= 0 ? 'profit-pos' : 'profit-neg';
  return `
    <div class="market-card">
      <div class="market-head"><h2>我的下注</h2>
        <div class="market-pool-badge">已投入 $${fmt(staked)}</div></div>
      <div class="market-desc">
        已結算損益 <span class="${cls}" style="font-weight:700">${settledProfit>=0?'+':''}${fmt(settledProfit)}</span>
        ${pending>0?`　·　尚有 $${fmt(pending)} 在未開的盤上`:''}
      </div>
      <div class="table-scroll"><table class="ledger">
        <thead><tr><th>盤口</th><th>選項</th><th class="num">鎖定賠率</th><th class="num">下注</th><th>狀態</th><th class="num">淨利</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
    </div>`;
}

/* ---------- 事件 ---------- */
function attachHandlers(){
  document.querySelectorAll('[data-bet-amt]').forEach(inp=>{
    inp.oninput = ()=>{ draftAmounts[inp.dataset.betAmt] = inp.value; };
    inp.onkeydown = (e)=>{
      if(e.key === 'Enter'){
        e.preventDefault();
        const [mid, oid] = inp.dataset.betAmt.split(':');
        placeBet(mid, oid);
      }
    };
  });
  document.querySelectorAll('[data-quick]').forEach(btn=>{
    btn.onclick = ()=>{
      const key = btn.dataset.quick;
      const inp = document.querySelector(`[data-bet-amt="${key}"]`);
      if(!inp) return;
      const next = (parseInt(inp.value,10) || 0) + parseInt(btn.dataset.amt,10);
      inp.value = Math.min(next, state.maxBet);
      draftAmounts[key] = inp.value;
      if(next > state.maxBet) showToast(`已達單筆上限 $${fmt(state.maxBet)}`);
      inp.focus();
    };
  });
  document.querySelectorAll('[data-bet-btn]').forEach(btn=>{
    btn.onclick = ()=>{
      const [mid, oid] = btn.dataset.betBtn.split(':');
      placeBet(mid, oid);
    };
  });
}

async function placeBet(marketId, optionId){
  if(!firebaseReady){ showToast('未連上資料庫，無法下注'); return; }
  const name = (document.getElementById('meName').value || '').trim();
  if(!name){
    showToast('請先在上方輸入你的暱稱');
    document.getElementById('meName').focus();
    return;
  }
  if(name !== me.name){ me.name = name; try{ localStorage.setItem(NAME_KEY, name); }catch(e){} }

  const key = `${marketId}:${optionId}`;
  const inp = document.querySelector(`[data-bet-amt="${key}"]`);
  const check = validateBetAmount(inp && inp.value, state.maxBet);
  if(!check.ok){ showToast(check.reason); return; }

  const btn = document.querySelector(`[data-bet-btn="${key}"]`);
  if(btn) btn.disabled = true;
  try{
    // 重讀伺服器端狀態：避免搶在封盤/結算的瞬間下注，上限也以伺服器為準
    const snap = await db.ref(DB_PATH).once('value');
    const raw = snap.val() || {};
    const m = (raw.markets || {})[marketId];
    if(!m)        { showToast('這個盤口已不存在'); return; }
    if(m.settled) { showToast('此盤已結算，無法下注'); return; }
    if(m.locked)  { showToast('此盤已封盤，無法下注'); return; }

    const serverMax = (typeof raw.maxBet === 'number' && raw.maxBet > 0) ? raw.maxBet : DEFAULT_MAX_BET;
    const recheck = validateBetAmount(inp.value, serverMax);
    if(!recheck.ok){ showToast(recheck.reason); return; }

    if(String(m.banker || '').trim() === name){
      showToast('你是這盤的莊家，不能在自己的盤上下注');
      return;
    }

    const fresh = normalize(raw);
    const freshPools = buildPools(fresh);
    const freshMarket = fresh.markets.find(x=>x.id === marketId);
    const oddsAtBet = liveOdds(freshPools, freshMarket, optionId).value;

    await db.ref(`${DB_PATH}/bets`).push({
      marketId, optionId, name, bettorId: me.id,
      amount: recheck.amount, ts: Date.now(), oddsAtBet
    });

    delete draftAmounts[key];
    if(inp) inp.value = '';
    showToast(`${name} 下注 $${fmt(recheck.amount)} @ ${oddsAtBet.toFixed(2)}x（已鎖定）`);
    requestAnimationFrame(()=>{
      const el = document.querySelector(`[data-odds-for="${key}"]`);
      if(el){ el.classList.add('flash'); setTimeout(()=>el.classList.remove('flash'), 500); }
    });
  }catch(e){
    showToast('下注失敗：' + String(e).slice(0,60));
  }finally{
    if(btn) btn.disabled = false;
  }
}

document.getElementById('meName').addEventListener('input', (e)=>{
  me.name = e.target.value.trim();
  try{ localStorage.setItem(NAME_KEY, me.name); }catch(err){}
});

boot();
</script>
</body>
</html>
